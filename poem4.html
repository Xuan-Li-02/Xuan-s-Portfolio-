    <section class="section-container" style="max-width: 800px; margin: 0 auto; text-align: left; padding-top: 60px;">
        <h1 style="color: #9b59b6; margin-bottom: 40px; font-size: 2rem; text-align: center;">《月亮》</h1>

        <div class="poem-text" style="font-size: 1.15rem; text-indent: 0;">
            <!-- 把你的诗歌全文粘贴在这里，每一行末尾加 <br> -->
            今夜<br>
            我们站在月亮下<br>
            看着时钟慢慢变短<br>
            不近不远的火红色<br>
            思考的最佳距离<br>

            你的眼里有雨<br>
            浮起褪色的爱情<br>
            千里之外<br>
            绵长的足音<br>

            我的脸是天晴<br>
            踩住昨日的欢愉<br>
            晒如童年和假期<br>

            月亮能否传达我的心？<br>
            月亮可不是传声机！<br>
            月亮也看我在眼里！<br>
            彼处亦可有云翳。<br>

            打开窗子<br>
            你说<br>
            打开窗子<br>
            我也同意<br>
            只有一只蚊子飞进来<br>
            吸了你的血<br>
            没有吸我的<br>

            交换一件外套<br>
            交换新的体温<br>
            覆盖那话语未到达的<br>
            ……<br>
            也许悲伤是甜的<br>
            我说<br>
            也许月亮也是甜的<br>
            你也同意<br>

            于是我们吞下月亮<br>
            像吞下一颗橘子糖<br>
            我按下快门<br>
            火开始燃烧<br>

        </div>
