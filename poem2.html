        <h1 style="color: #9b59b6; margin-bottom: 40px; font-size: 2rem; text-align: center;">《八月走过三分之一（组诗）》</h1>

        <div class="poem-text" style="font-size: 1.15rem; text-indent: 0;">
            <!-- 把你的诗歌全文粘贴在这里，每一行末尾加 <br> -->
            （一）空调<br>
             夜晚，<br>
             当鸟儿也睡着的时候，<br>
             只剩空调还在工作。<br>
             我们在空调的工作声中入梦。<br>
             “是雨水沸腾的声音”，<br>
             我的梦这样说。<br>
             <br><br>
            （二）一则死亡消息<br>
             凌晨三点，<br>
             鞭炮响了三声，<br>
             来自头顶的田野。<br>
             清晨，<br>
             奶奶带回一则消息，<br>
             和不长不短的叹息。<br>
             死亡正从最左边赶来。<br>
             上午，<br>
             我在哀歌中醒来，<br>
             啊，今天没有早餐。<br>
            <br><br>
            （三）偶遇路易<br>
             偶遇路易时，<br>
             他踩着疯癫的山地车过来，<br>
             于是我的哭泣转为默剧。<br>
             “会笑的人也要会哭泣”。<br>
             他和疯癫的山地车都没有停，<br>
             他的马尾好像一只狐狸。<br>
        </div>
